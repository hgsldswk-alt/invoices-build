name: Invoices
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  knownRegions: [en, zh-Hans, zh-Hant]
settings:
  base:
    APP_ID: com.hgsldswk.invoices
    APP_STORE_ID: __APP_STORE_ID__
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  Invoices:
    type: application
    platform: iOS
    sources: [Invoices, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID)
        TARGETED_DEVICE_FAMILY: "1"  # 2026-11-19 只做 iPhone：支持 iPad 会被要求 iPad 截图，提交被拒
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Invoices AppStore
    info:
      path: Invoices/Info.plist
      properties:
        CFBundleDisplayName: Invoices
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [remote-notification]
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: Unlock your invoices on this device.
        NSCameraUsageDescription: Attach a photo to your document.
        InvoicesProProductID: $(APP_ID).pro
        InvoicesTrialProductID: $(APP_ID).trial
        InvoicesAppGroup: group.$(APP_ID)
        InvoicesCloudContainer: iCloud.$(APP_ID)
        APP_STORE_ID: $(APP_STORE_ID)
        CFBundleURLTypes:
          - CFBundleURLName: $(APP_ID)
            CFBundleURLSchemes: [invoices]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.hgsldswk.invoices.backup
            UTTypeDescription: Invoices Backup
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [invoicesbackup]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Invoices Backup
            LSHandlerRank: Owner
            LSItemContentTypes: [com.hgsldswk.invoices.backup]
    entitlements:
      path: Invoices/Invoices.entitlements
      properties:
        com.apple.security.application-groups: [group.$(APP_ID)]
        com.apple.developer.icloud-container-identifiers: [iCloud.$(APP_ID)]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: production
    dependencies:
      - target: InvoicesWidget
  InvoicesWidget:
    type: app-extension
    platform: iOS
    sources:
      - InvoicesWidget
      - path: Shared/L10n.swift
      - path: Shared/Localizable.xcstrings
      - path: Shared/WidgetSnapshot.swift
      - path: Shared/Launch.swift
      - path: Shared/Entitlement.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).widget
        TARGETED_DEVICE_FAMILY: "1"  # 2026-11-19 只做 iPhone：支持 iPad 会被要求 iPad 截图，提交被拒
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Invoices Widget AppStore
    info:
      path: InvoicesWidget/Info.plist
      properties:
        CFBundleDisplayName: Invoices
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        InvoicesAppGroup: group.$(APP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: InvoicesWidget/InvoicesWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.$(APP_ID)]
  InvoicesTests:
    type: bundle.unit-test
    platform: iOS
    sources: [InvoicesTests]
    dependencies:
      - target: Invoices
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  InvoicesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [InvoicesUITests]
    dependencies:
      - target: Invoices
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Invoices
schemes:
  Invoices:
    build:
      targets:
        Invoices: all
        InvoicesTests: [test]
    test:
      config: Debug
      targets: [InvoicesTests]
  InvoicesUI:
    build:
      targets:
        Invoices: all
        InvoicesUITests: [test]
    test:
      config: Debug
      targets: [InvoicesUITests]
